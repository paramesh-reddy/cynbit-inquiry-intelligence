services:
  - type: web
    name: cynbit-inquiry-intelligence-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: cynbit-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: cynbit-postgres
    plan: free
